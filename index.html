<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Légion des Anciens - WoW: Forever</title>
    <style>
        /* =========================================
           GLOBAL & PALETTE WOW
        ========================================= */
        :root {
            /* Couleurs de fond */
            --wow-bg: #050505; /* Noir acier profond */
            --wow-panel-bg: rgba(20, 20, 20, 0.95); /* Anthracite biseauté */
            
            /* Couleurs d'accentuation */
            --wow-gold: #d4af37; /* Or Royal */
            --wow-gold-dim: #9c7c25; /* Or Vieilli */
            --wow-gold-bright: #f1e0ac; /* Or Brillant */
            
            --wow-blue-light: #4ecdc4; /* Bleu Spectral (alliage/magie) */
            --wow-blue: #2f89fc; /* Bleu Magique */
            
            /* Textes */
            --wow-text: #e7e2d0; /* Parchemin clair */
            --wow-text-muted: #8c8371; /* Pierre grise */
            
            /* Bordures & Ombres */
            --wow-border-gold: 2px solid #5a4a2a; /* Bordure métallique biseautée */
            --wow-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            --wow-glow-gold: 0 0 15px rgba(212, 175, 55, 0.3);
            
            /* Polices (Simulées épiques) */
            --wow-font-serif: 'Cinzel', serif; /* Épique/Ancien */
            --wow-font-sans: 'Open Sans', sans-serif; /* Standard WoW */
        }

        /* Police Épique optionnelle - Vous pouvez commenter si vous ne l'aimez pas */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Open+Sans:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--wow-bg);
            background-image: url('https://www.transparenttextures.com/patterns/dark-metal.png'); /* Texture métal sombre */
            color: var(--wow-text);
            font-family: var(--wow-font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: var(--wow-blue-light);
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--wow-gold-bright);
        }

        h1, h2, h3 {
            font-family: var(--wow-font-serif);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* =========================================
           HEADER (HERO SECTION) ÉPIQUE
        ========================================= */
        header {
            position: relative;
            height: 80vh; /* Grand en-tête immersif */
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(5, 5, 5, 1)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            border-bottom: 3px solid #5a4a2a; /* Bordure dorée épaisse */
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            padding: 0 20px;
        }

        /* Incrustation d'ombrage pour le texte */
        header .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1;
        }

        header .content {
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 4.5rem;
            color: var(--wow-gold-bright);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8),
                         0 0 50px rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }

        header p {
            font-size: 1.6rem;
            color: var(--wow-text-muted);
            font-family: var(--wow-font-serif);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Bouton Épique */
        .btn-join {
            display: inline-block;

            color: white;
            font-family: var(--wow-font-serif);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1.3rem;
